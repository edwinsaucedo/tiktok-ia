name: Videos de Flow desde Google Drive

on:
  schedule:
    # Cada hora, de 7 a. m. a 11 p. m. hora del centro de México (13:00–05:00 UTC).
    - cron: "41 0-5,13-23 * * *"
  workflow_dispatch:

permissions:
  contents: write   # guardar qué historias ya se procesaron
  issues: write     # avisarte con el caption listo para copiar

concurrency:
  group: tiktok-ia  # nunca corre al mismo tiempo que el modo automático (comparten el token de TikTok)
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-24.04
    outputs:
      listo: ${{ steps.revisar.outputs.listo }}
    steps:
      - name: Revisar que existan los secretos
        id: revisar
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ -n "$GCP_SA_KEY" ] && [ -n "$TIKTOK_REFRESH_TOKEN" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Faltan secretos (README, paso 5). No se revisa Drive."
          fi

  flow:
    needs: verificar
    if: ${{ needs.verificar.outputs.listo == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install -q -r requirements.txt

      - name: Conectar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ¿Hay videos nuevos en Drive?
        id: revisar
        run: python -m pipeline.flow --revisar

      - name: Instalar ffmpeg
        if: ${{ steps.revisar.outputs.hay_trabajo == '1' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Procesar el video y mandarlo a TikTok
        id: pipeline
        if: ${{ steps.revisar.outputs.hay_trabajo == '1' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python -m pipeline.flow

      - name: Guardar el nuevo refresh token de TikTok
        if: ${{ always() && hashFiles('salida/nuevo_refresh_token.txt') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TikTok entregó un refresh token nuevo pero no hay secreto GH_PAT para guardarlo. Revisa el paso 4 del README."
          else
            gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < salida/nuevo_refresh_token.txt
            echo "Refresh token actualizado."
          fi
          rm -f salida/nuevo_refresh_token.txt

      - name: Guardar el video (descargable 7 días)
        if: ${{ always() && steps.pipeline.outputs.video != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: flow-${{ github.run_number }}
          path: ${{ steps.pipeline.outputs.video }}
          retention-days: 7

      - name: Actualizar el registro de historias
        if: ${{ always() && steps.revisar.outputs.hay_trabajo == '1' }}
        run: |
          git config user.name "tiktok-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Flow: video procesado $(date -u +%F)"
          for intento in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          echo "::error::No se pudo guardar el registro."
          exit 1

      - name: Avisarme (issue con el caption)
        if: ${{ always() && hashFiles('salida/aviso_titulo.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$(cat salida/aviso_titulo.txt)" \
            --body-file salida/aviso.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"
