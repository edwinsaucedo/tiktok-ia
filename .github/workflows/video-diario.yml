name: Video diario para TikTok

on:
  schedule:
    # Martes y viernes a las 15:17 UTC = 9:17 a. m. hora del centro de México (UTC-6).
    # Para lunes, miércoles y viernes usa "17 15 * * 1,3,5" (revisa el costo en el README antes).
    - cron: "17 15 * * 2,5"
  workflow_dispatch:
    inputs:
      simular:
        description: "Simular el video (clips de prueba, NO gasta créditos de Google)"
        type: boolean
        default: false
      subir_a_tiktok:
        description: "Mandar el video a TikTok como borrador"
        type: boolean
        default: true

permissions:
  contents: write   # guardar el estado de la cola de ideas
  issues: write     # avisarte con el caption listo para copiar

concurrency:
  group: video-diario
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: Conectar con Google Cloud
        if: ${{ inputs.simular != true }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Generar video y mandarlo a TikTok
        id: pipeline
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          SIMULAR: ${{ inputs.simular == true && '1' || '0' }}
          # En las ejecuciones programadas no hay inputs: siempre se sube.
          NO_SUBIR: ${{ github.event_name == 'workflow_dispatch' && inputs.subir_a_tiktok == false && '1' || '0' }}
        run: python -m pipeline.run

      - name: Guardar el nuevo refresh token de TikTok
        if: ${{ always() && hashFiles('salida/nuevo_refresh_token.txt') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::TikTok entregó un refresh token nuevo pero no hay secreto GH_PAT para guardarlo. Revisa el paso 5 del README."
          else
            gh secret set TIKTOK_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < salida/nuevo_refresh_token.txt
            echo "Refresh token actualizado."
          fi
          rm -f salida/nuevo_refresh_token.txt

      - name: Guardar el video (descargable 7 días)
        if: ${{ always() && steps.pipeline.outputs.video != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: ${{ steps.pipeline.outputs.video }}
          retention-days: 7

      - name: Actualizar la cola de ideas
        if: ${{ always() && inputs.simular != true }}
        run: |
          git config user.name "tiktok-ia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/
          if git diff --cached --quiet; then
            echo "Sin cambios en la cola."
            exit 0
          fi
          git commit -m "Cola de ideas: $(date -u +%F)"
          for intento in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          echo "::error::No se pudo guardar la cola de ideas."
          exit 1

      - name: Avisarme (issue con el caption)
        if: ${{ always() && hashFiles('salida/aviso_titulo.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$(cat salida/aviso_titulo.txt)" \
            --body-file salida/aviso.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"
